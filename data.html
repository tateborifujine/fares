    <script>
        function tohalf(str) {// 全角英数字を半角に変換
            str = str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function (s) {
                return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
            }); return str;
        }; function tofull(str) {// 半角英数字を全角に変換
            if (typeof str == "number") str = str.toString();
            str = str.replace(/[A-Za-z0-9]/g, function (s) {
                return String.fromCharCode(s.charCodeAt(0) + 0xFEE0);
            }); return str;
        };
    </script>

                    for (let i2 = 0; i2 < temp.s[v].sta[i][3].length; i2++) {

                } temp.i += `</td><td>${temp.s[v].sta[i][4]}</td>`;

        }; view.f.select.change = () => {
            temp.s1 = document.getElementById("sta_select").options[document.getElementById("sta_select").selectedIndex].value;

        }; view.f.csv.linedownload = () => {
            if (temp.v == "") {
                alert("路線が選択されていません。");
                return false;
            } temp.allcode = [];
            if (temp.v in sta.kana) {
                for (let i = 0; i < sta.kana[temp.v].sta.length; i++) {
                    temp.allcode2 = [];
                    if (document.getElementById("csv_code").checked) temp.allcode2.push(`${sta.kana[temp.v].sta[i][0]}`);
                    if (document.getElementById("csv_name").checked) temp.allcode2.push(`${sta.kana[temp.v].sta[i][1]}`);
                    if (document.getElementById("csv_kana").checked) temp.allcode2.push(`${sta.kana[temp.v].sta[i][2]}`);
                    if (document.getElementById("csv_line").checked) temp.allcode2.push(`${sta.kana[temp.v].sta[i][3].join(";")}`);
                    if (document.getElementById("csv_kiro1").checked) temp.allcode2.push(`${sta.kana[temp.v].sta[i][4]}`);
                    if (document.getElementById("csv_kiro2").checked) {
                        if (sta.kana[temp.v].sta[i][5] == void 0) temp.allcode2.push("");
                        else temp.allcode2.push(`${sta.kana[temp.v].sta[i][5]}`);

            } else {
                for (let i = 0; i < sta.skana[temp.v].sta.length; i++) {

                    if (document.getElementById("csv_code").checked) temp.allcode2.push(`${sta.skana[temp.v].sta[i][0]}`);
                    if (document.getElementById("csv_name").checked) temp.allcode2.push(`${sta.skana[temp.v].sta[i][1]}`);

                    if (document.getElementById("csv_kiro1").checked) temp.allcode2.push(`${sta.skana[temp.v].sta[i][4]}`);
                    temp.allcode.push(temp.allcode2.join(","));

            } temp.allcode = temp.allcode.join("\n");

            for (let i = 0; i < sta.allkana2.length; i++) {

                    else temp.allcode3[sta.kana[sta.allkana2[i]].sta[i2][0].toString()] = true;
                    temp.allcode2 = [];
                    if (document.getElementById("csv_code").checked) temp.allcode2.push(`${sta.kana[sta.allkana2[i]].sta[i2][0]}`);
                    if (document.getElementById("csv_name").checked) temp.allcode2.push(`${sta.kana[sta.allkana2[i]].sta[i2][1]}`);
                    if (document.getElementById("csv_kana").checked) temp.allcode2.push(`${sta.kana[sta.allkana2[i]].sta[i2][2]}`);
                    if (document.getElementById("csv_line").checked) {
                        if (Array.isArray(sta.kana[sta.allkana2[i]].sta[i2][3])) temp.allcode2.push(`${sta.allkana2[i]};${sta.kana[sta.allkana2[i]].sta[i2][3].join(";")}`);
                        else temp.allcode2.push("");
                    }
                    temp.allcode.push(temp.allcode2.join(","));
                }
            } for (let i = 0; i < sta.allskana.length; i++) {
                for (let i2 = 0; i2 < sta.skana[sta.allskana[i]].sta.length; i2++) {
                    if (sta.skana[sta.allskana[i]].sta[i2][0].toString() in temp.allcode3) continue;
                    else temp.allcode3[sta.skana[sta.allskana[i]].sta[i2][0].toString()] = true;
                    temp.allcode2 = [];
                    if (document.getElementById("csv_code").checked) temp.allcode2.push(`${sta.skana[sta.allskana[i]].sta[i2][0]}`);
                    if (document.getElementById("csv_name").checked) temp.allcode2.push(`${sta.skana[sta.allskana[i]].sta[i2][1]}`);
                    if (document.getElementById("csv_kana").checked) {
                        if (sta.skana[sta.allskana[i]].sta[i2][2] == void 0) temp.allcode2.push("");
                        else temp.allcode2.push(`${sta.skana[sta.allskana[i]].sta[i2][2]}`);
                    } if (document.getElementById("csv_line").checked) {
                        if (Array.isArray(sta.skana[sta.allskana[i]].sta[i2][3])) temp.allcode2.push(`${sta.allskana[i]};${sta.skana[sta.allskana[i]].sta[i2][3].join(";")}`);
                        else temp.allcode2.push("");
                    }
                    temp.allcode.push(temp.allcode2.join(","));
                }
            } temp.allcode = temp.allcode.join("\n");
            const blob = new Blob([new Uint8Array([0xef, 0xbb, 0xbf]), temp.allcode], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'allcode.csv';
            a.click();
            URL.revokeObjectURL(a.href);
        };

        const kanaToRoman = (targetStr, type, options) => {
            const latins = {
                hepburn: {
                    'a': 257,
                    'i': 299,
                    'u': 363,
                    'e': 275,
                    'o': 333
                },
                kunrei: {
                    'a': 226,
                    'i': 238,
                    'u': 251,
                    'e': 234,
                    'o': 244
                }
            };
            if (typeof targetStr !== 'string' && typeof targetStr !== 'number') return targetStr;
            let remStr = String(targetStr), result = '', slStr, roman, lastStr;
            const splice = () => {
                const oneChar = remStr.slice(0, 1);
                remStr = remStr.slice(1);
                return oneChar;
            };
            const isSmallChar = () => !!remStr.slice(0, 1).match(/^[ぁぃぅぇぉゃゅょァィゥェォャュョ]$/);
            const toHiragana = kana => kana.replace(/[\u30a1-\u30f6]/g, match => {
                return String.fromCharCode(match.charCodeAt(0) - 0x60);
            });
            const getRoman = kana => {
                const roman = romanMap[toHiragana(kana)];
                if (roman) return roman;
                else return kana;
            };
            while (remStr) {
                slStr = splice();
                if (slStr.match(/^(っ|ッ)$/)) {
                    slStr = splice();
                    if (isSmallChar()) slStr += splice();
                    roman = getRoman(slStr);
                    roman = (roman !== slStr ? roman.slice(0, 1) : '') + roman;
                } else {
                    if (isSmallChar()) slStr += splice();
                    roman = getRoman(slStr);
                } const nextRoman = kanaToRoman(remStr.slice(0, 1));
                if (roman === 'n') {
                    if (nextRoman.match(/^[aiueo]$/)) roman += type === 'hepburn' ? '-' : '\'';
                    else if (nextRoman.match(/^[bmp]/))  roman = 'm';
                } else if (roman === '-') {
                    lastStr = result.match(/[aiueo]$/);
                    if (lastStr && options.longSound === 'latin') {
                        result = result.slice(0, -1);
                        roman = String.fromCharCode(latins[type][lastStr[0]]);
                    }
                }
                result += roman;
            }
            return result;
        };
